<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROFILE | TAZAWA PORTFOLIO</title>
<link rel="stylesheet" href="./portfolio.css">
<!-- 縦長の画面（スマホ）はトップより縦に長いので、行数を増やす（main-portfolio.js は --rows を読んでマスの大きさを決める） -->
<style>
@media (max-aspect-ratio: 1/1), (max-width: 760px) { :root { --rows: 16; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="grid" aria-hidden="true"></canvas>

<!-- プロフィール。トップの 03 のカードから来る。置き方はトップと同じ（--c, --r, --w, --h = 横長 16×10、--mc, --mr, --mw, --mh = 縦長 8×16）。
     文章・スキル・連絡先は仮。決まったらここを書き換える。
     「← TOP」は data-card data-link：押すと凹み、離すとトップへ戻る -->
<main class="board">
  <h1 class="card card--title"
      style="--c:0; --r:0; --w:7; --h:2;  --mc:0; --mr:0; --mw:6; --mh:2;">
    <span>TAZAWA</span><span>PROFILE</span>
  </h1>
  <a class="card card--index card--all" href="./index.html" data-card data-link
     style="--c:13; --r:0; --w:3; --h:2;  --mc:6; --mr:0; --mw:2; --mh:2;">
    <span>← TOP</span><span>03</span>
  </a>

  <section class="card card--text"
           style="--c:0; --r:3; --w:7; --h:5;  --mc:0; --mr:3; --mw:8; --mh:4;">
    <h2>ABOUT</h2>
    <p>田澤（TAZAWA）。Web サイトとアプリケーションのデザインから、実装までを一人で手がけています。</p>
    <p>方眼と立体の動きのように、画面の中で「触れると応える」ことを大事にしています。</p>
  </section>

  <section class="card card--text"
           style="--c:8; --r:3; --w:4; --h:4;  --mc:0; --mr:8; --mw:8; --mh:3;">
    <h2>SKILLS</h2>
    <dl>
      <dt>DESIGN</dt><dd>Figma / UI / グラフィック</dd>
      <dt>CODE</dt><dd>HTML / CSS / JavaScript / WebGL</dd>
      <dt>3D</dt><dd>Blender / three.js</dd>
    </dl>
  </section>

  <section class="card card--text"
           style="--c:13; --r:3; --w:3; --h:4;  --mc:0; --mr:12; --mw:8; --mh:2;">
    <h2>CONTACT</h2>
    <dl>
      <dt>MAIL</dt><dd>COMING SOON</dd>
      <dt>SNS</dt><dd>COMING SOON</dd>
    </dl>
  </section>

  <footer class="card card--foot"
          style="--c:5; --r:9; --w:5; --h:1;  --mc:0; --mr:15; --mw:5; --mh:1;">
    <span>© 2026 TAZAWA</span><span>DESIGN / CODE</span>
  </footer>
</main>

<script type="module" src="./main-portfolio.js"></script>
</body>
</html>
